version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/UI
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # ImageSharp 4.x requires a paid license key for Release builds
      - dependency-name: SixLabors.ImageSharp
        versions: [">=4.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
